[meta]
name = "openai_responses_streaming_simple"
protocol = "openai_responses"

[request]
method = "POST"
path = "/v1/responses"
host = "api.openai.com"

[request.headers]
content-type = "application/json"

[request.body]
raw = '''
{"model":"gpt-4o","stream":true,"input":"What is 2+2?"}
'''

[response]
status = 200

[response.headers]
content-type = "text/event-stream"

[response.body]
raw = '''
event: response.created
data: {"type":"response.created","response":{"id":"resp_stream_test","object":"response","model":"gpt-4o-2024-08-06","status":"in_progress","output":[],"usage":null}}

event: response.output_item.added
data: {"type":"response.output_item.added","output_index":0,"item":{"type":"message","role":"assistant","content":[]}}

event: response.content_part.added
data: {"type":"response.content_part.added","output_index":0,"content_index":0,"part":{"type":"output_text","text":""}}

event: response.output_text.delta
data: {"type":"response.output_text.delta","output_index":0,"content_index":0,"delta":"2 + 2"}

event: response.output_text.delta
data: {"type":"response.output_text.delta","output_index":0,"content_index":0,"delta":" = 4"}

event: response.output_text.done
data: {"type":"response.output_text.done","output_index":0,"content_index":0,"text":"2 + 2 = 4"}

event: response.content_part.done
data: {"type":"response.content_part.done","output_index":0,"content_index":0,"part":{"type":"output_text","text":"2 + 2 = 4"}}

event: response.output_item.done
data: {"type":"response.output_item.done","output_index":0,"item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"2 + 2 = 4"}]}}

event: response.completed
data: {"type":"response.completed","response":{"id":"resp_stream_test","object":"response","model":"gpt-4o-2024-08-06","status":"completed","output":[{"type":"message","role":"assistant","content":[{"type":"output_text","text":"2 + 2 = 4"}]}],"usage":{"input_tokens":15,"output_tokens":10,"total_tokens":25}}}

'''

[transport]
request_fragments = 1
response_fragments = 1

[timing]
request_start_ns = 1_000_000_000
response_first_byte_ns = 1_100_000_000
response_complete_ns = 2_000_000_000

[expected]
id = "resp_stream_test"
model = "gpt-4o-2024-08-06"
input_tokens = 15
output_tokens = 10
stop_reason = "completed"
streaming = true
kind = "llm_call"
tools = []
latency_ms = 100
ttft_ms = 100
