[meta]
name = "openai_streaming_simple"
protocol = "openai_completions"

[request]
method = "POST"
path = "/v1/chat/completions"
host = "api.openai.com"

[request.headers]
content-type = "application/json"

[request.body]
raw = '''
{"model":"gpt-4o","stream":true,"stream_options":{"include_usage":true},"messages":[{"role":"user","content":"hi"}]}
'''

[response]
status = 200

[response.headers]
content-type = "text/event-stream"

[response.body]
raw = '''
data: {"id":"chatcmpl-test-stream","object":"chat.completion.chunk","created":1700000000,"model":"gpt-4o-2024-08-06","choices":[{"index":0,"delta":{"role":"assistant","content":""},"finish_reason":null}]}

data: {"id":"chatcmpl-test-stream","object":"chat.completion.chunk","created":1700000000,"model":"gpt-4o-2024-08-06","choices":[{"index":0,"delta":{"content":"Hello"},"finish_reason":null}]}

data: {"id":"chatcmpl-test-stream","object":"chat.completion.chunk","created":1700000000,"model":"gpt-4o-2024-08-06","choices":[{"index":0,"delta":{"content":" there!"},"finish_reason":null}]}

data: {"id":"chatcmpl-test-stream","object":"chat.completion.chunk","created":1700000000,"model":"gpt-4o-2024-08-06","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

data: {"id":"chatcmpl-test-stream","object":"chat.completion.chunk","created":1700000000,"model":"gpt-4o-2024-08-06","choices":[],"usage":{"prompt_tokens":8,"completion_tokens":4,"total_tokens":12}}

data: [DONE]

'''

[transport]
request_fragments = 1
response_fragments = 1
chunked = false

[timing]
request_start_ns = 3_000_000_000
response_first_byte_ns = 3_400_000_000
response_complete_ns = 3_500_000_000

[expected]
id = "chatcmpl-test-stream"
model = "gpt-4o-2024-08-06"
input_tokens = 8
output_tokens = 4
stop_reason = "stop"
streaming = true
kind = "llm_call"
tools = []
latency_ms = 400
ttft_ms = 400
