response_first_byte_ns = 5_600_000_000
response_complete_ns = 5_800_000_000

[expected]
id = "msg_test_ns_chunked"
model = "claude-haiku-4-5-20251001"
input_tokens = 10
output_tokens = 5
stop_reason = "end_turn"
streaming = false
