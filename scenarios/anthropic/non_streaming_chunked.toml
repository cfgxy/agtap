[meta]
name = "anthropic_non_streaming_chunked"
protocol = "anthropic"

[request]
method = "POST"
path = "/v1/messages"
host = "api.anthropic.com"

[request.headers]
content-type = "application/json"
anthropic-version = "2023-06-01"

[request.body]
raw = '''
{"model":"claude-haiku-4-5-20251001","max_tokens":50,"messages":[{"role":"user","content":"hi"}]}
'''

[response]
status = 200

[response.headers]
content-type = "application/json"
transfer-encoding = "chunked"

[response.body]
raw = '''
{"id":"msg_test_ns_chunked","type":"message","role":"assistant","model":"claude-haiku-4-5-20251001","content":[{"type":"text","text":"Hello!"}],"stop_reason":"end_turn","usage":{"input_tokens":10,"output_tokens":5}}
'''

[transport]
request_fragments = 1
response_fragments = 1
chunked = true

[timing]
