[package]
name = "agtap"
version = "0.1.0"
edition = "2021"
description.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
agtap-common = { path = "../agtap-common" }
aya = "0.13"
anyhow = "1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
flate2 = "1"
httparse = "1"
libc = "0.2"
log = "0.4"
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "metrics", "spec_unstable_metrics_views"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["http-proto", "trace", "metrics", "reqwest-blocking-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
indexmap = "2"
memmap2 = "0.9"
object = { version = "0.36", default-features = false, features = ["elf", "read"] }
prometheus-client = "0.24"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
agtap-mock = { path = "../agtap-mock" }
toml = "0.8"
insta = { version = "1", features = ["json"] }
datatest-stable = "0.2"
tempfile = "3"

[[test]]
name = "pipeline"
harness = false

[build-dependencies]
aya-build = "0.1"
